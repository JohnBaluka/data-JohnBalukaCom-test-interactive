const D=DATA, M=D.months, CATS=D.cats, REGS=D.regs;
const MLAB=M.map(m=>{const[y,mo]=m.split("-");
 return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mo-1]+" "+y.slice(2)});

function money(n){const s=n<0?"-":"";n=Math.abs(Math.round(n));
 if(n>=1e6)return s+(n/1e6).toFixed(2)+"M";
 if(n>=1e3)return s+Math.round(n/1e3)+"K";
 return s+n}
function signed(n){return (n>0?"+":"")+money(n)}
function pct(n,d){return d?((n/d)*100):0}

/* ---------- aggregation ---------- */
function catTotals(a,b){
 return CATS.map((c,ci)=>{
  let bu=0,ac=0;
  for(let i=a;i<=b;i++){bu+=D.bud[i][ci];for(let r=0;r<REGS.length;r++)ac+=D.act[i][ci][r]}
  return {k:c,ci,bud:bu,act:ac,v:bu-ac};
 });
}
function regTotals(a,b,cats){
 return REGS.map((r,ri)=>{
  let ac=0;
  for(let i=a;i<=b;i++)CATS.forEach((c,ci)=>{if(!cats||cats.has(c))ac+=D.act[i][ci][ri]});
  return {k:r,ri,act:ac};
 });
}
function monthly(a,b){
 const out=[];
 for(let i=a;i<=b;i++){let bu=0,ac=0;
  CATS.forEach((c,ci)=>{bu+=D.bud[i][ci];for(let r=0;r<REGS.length;r++)ac+=D.act[i][ci][r]});
  out.push({i,m:M[i],bud:bu,act:ac});}
 return out;
}

/* ---------- tooltip ---------- */
const TIP=document.createElement("div");TIP.className="tooltip";TIP.setAttribute("role","status");document.body.appendChild(TIP);
function tipShow(html,x,y){TIP.innerHTML=html;TIP.classList.add("show");const r=TIP.getBoundingClientRect();
 TIP.style.left=Math.min(window.innerWidth-r.width-8,Math.max(8,x+14))+"px";
 TIP.style.top=Math.max(8,y-r.height-12)+"px"}
function tipHide(){TIP.classList.remove("show")}
function bindTip(el,fn){
 el.addEventListener("mousemove",e=>tipShow(fn(),e.clientX,e.clientY));
 el.addEventListener("mouseleave",tipHide);
 el.addEventListener("focus",()=>{const r=el.getBoundingClientRect();tipShow(fn(),r.left,r.bottom+r.height)});
 el.addEventListener("blur",tipHide);
}
document.addEventListener("keydown",e=>{if(e.key==="Control")tipHide()});

/* ---------- controls ---------- */
function chipGroup(host,label,items,get,set){
 const box=document.createElement("div");box.className="fgroup";box.setAttribute("role","radiogroup");box.setAttribute("aria-label",label);
 const l=document.createElement("span");l.className="flab";l.textContent=label;box.appendChild(l);
 items.forEach(([v,t],i)=>{
  const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("role","radio");
  b.setAttribute("aria-posinset",String(i+1));b.setAttribute("aria-setsize",String(items.length));
  b.setAttribute("aria-checked",String(get()===v));b.textContent=t;b.dataset.v=v;
  b.addEventListener("click",()=>{set(v);
   [...box.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-checked",String(x.dataset.v===String(get()))));
   render()});
  box.appendChild(b)});
 host.appendChild(box);
 return box;
}
function buildCtrls0(){

 b.setAttribute("aria-pressed",String(DIR===1));
 b.textContent=DIR===-1?"High to low":"Low to high";

  b.textContent=DIR===-1?"High to low":"Low to high";render()});

}
function buildCtrls1(){
 const h=document.getElementById("ctrls1");h.innerHTML="";
 const mk=(lab,id,min,max,val,step,fn)=>{
  const w=document.createElement("div");w.className="slider";
  const l=document.createElement("label");l.className="flab";l.textContent=lab;l.htmlFor=id;
  const r=document.createElement("input");r.type="range";r.id=id;r.min=min;r.max=max;r.value=val;r.step=step;
  const o=document.createElement("span");o.className="rdval";o.id=id+"out";
  r.addEventListener("input",()=>{fn(+r.value);render()});
  w.append(l,r,o);h.appendChild(w);return r;
 };

 const maxCat=Math.max(...catTotals(0,M.length-1).map(x=>x.act));

function syncSliders(){
 const f=document.getElementById("rFrom"),t=document.getElementById("rTo"),a=document.getElementById("rAmt");
 if(!f)return;
 f.value=R0;t.value=R1;a.value=AMIN;

}
function togglePlay(){PLAY?stopPlay():startPlay()}
function startPlay(){
 const b=document.getElementById("playBtn");
 R1=R0; syncSliders(); render();
 b.textContent="■ Pause";b.setAttribute("aria-pressed","true");

  if(R1>=M.length-1){stopPlay();return}
  R1++;syncSliders();render();

}

function renderKPIs(ct){
 const bu=ct.reduce((s,x)=>s+x.bud,0), ac=ct.reduce((s,x)=>s+x.act,0), v=bu-ac;
 const over=ct.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
 const best=ct.slice().sort((a,b)=>b.v-a.v)[0];
 const cells=[
  ["Budget",money(bu),M.length+" months"],
  ["Actual",money(ac),pct(ac,bu).toFixed(1)+"% of budget"],
  [v>=0?"Under budget":"Over budget",signed(v),Math.abs(pct(v,bu)).toFixed(1)+"% variance"],
  ["Categories over",String(over.length)+" of "+ct.length,over.length?over[0].k+" worst":"none"],
  ["Biggest saving",best?best.k:"—",best?signed(best.v):""]
 ];
 document.getElementById("kpis").innerHTML=cells.map(([l,val,d])=>
  `<div class="kpi"><div class="v">${val}</div><div class="l">${l}</div><div class="d">${d}</div></div>`).join("");
}
function sortCats(ct){
 const key=x=>SORT==="var"?x.v:SORT==="act"?x.act:SORT==="bud"?x.bud:SORT==="pct"?pct(x.v,x.bud):0;
 const s=ct.slice();
 if(SORT==="name")s.sort((a,b)=>a.k.localeCompare(b.k)*(DIR===-1?1:-1));
 else s.sort((a,b)=>(key(b)-key(a))*(DIR===-1?1:-1));
 return s;
}
function renderCats(ct){
 const host=document.getElementById("catRows");host.innerHTML="";
 const list=sortCats(ct);
 const max=Math.max(...list.map(x=>Math.max(x.bud,x.act)))||1;
 list.forEach((x,i)=>{
  const b=document.createElement("button");b.type="button";b.className="row";
  b.setAttribute("aria-posinset",String(i+1));b.setAttribute("aria-setsize",String(list.length));
  const over=x.v<0;
  b.innerHTML=`<span class="rk">${i+1}</span><span class="n">${x.k}</span>`+
   `<span class="bars"><span class="track"><span class="fill b" style="width:${Math.max(2,x.bud/max*100)}%"></span></span>`+
   `<span class="track"><span class="fill ${over?"a":"under"}" style="width:${Math.max(2,x.act/max*100)}%"></span></span></span>`+
   `<span class="val ${over?"over":"under"}">${signed(x.v)}</span>`;
  if(FOCUS&&FOCUS!==x.k)b.classList.add("dim");
  bindTip(b,()=>`<b>${x.k}</b><br>Budget ${money(x.bud)} &middot; Actual ${money(x.act)}<br>`+
   `${over?"Over":"Under"} by ${money(Math.abs(x.v))} (${Math.abs(pct(x.v,x.bud)).toFixed(1)}%)`);
  b.addEventListener("click",()=>{FOCUS=FOCUS===x.k?null:x.k;render()});
  host.appendChild(b)});
}
function renderSide(){

 const tot=rt.reduce((s,x)=>s+x.act,0)||1;

 document.getElementById("sideTitle").textContent=FOCUS?FOCUS+" by region":"Region split";

function renderMini(){
 const ci=FOCUS?CATS.indexOf(FOCUS):-1;
 const s=M.map((m,i)=>{
  let bu=0,ac=0;
  if(ci>=0){bu=D.bud[i][ci];for(let r=0;r<REGS.length;r++)ac+=D.act[i][ci][r]}
  else CATS.forEach((c,k)=>{bu+=D.bud[i][k];for(let r=0;r<REGS.length;r++)ac+=D.act[i][k][r]});
  return {bu,ac}});
 const max=Math.max(...s.map(x=>Math.max(x.bu,x.ac)))||1,W=300,H=70;
 const line=(sel,col,dash)=>`<polyline points="${s.map((p,i)=>`${i/(s.length-1)*W},${H-4-(sel(p)/max)*(H-10)}`).join(" ")}"
  fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="5 4"':''}/>`;
 document.getElementById("miniBox").innerHTML=
  `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Monthly budget and actual trend for ${FOCUS||"all categories"} from ${MLAB[0]} to ${MLAB[M.length-1]}">
   ${line(p=>p.bu,"var(--a1)",true)}${line(p=>p.ac,"var(--a2)",false)}</svg>`;
}

/* ---------- insights ---------- */
function insights(){
 const ct=catTotals(0,M.length-1);
 const bu=ct.reduce((s,x)=>s+x.bud,0), ac=ct.reduce((s,x)=>s+x.act,0);
 const over=ct.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
 const under=ct.slice().sort((a,b)=>b.v-a.v);
 const mo=monthly(0,M.length-1);
 const worstM=mo.slice().sort((a,b)=>(a.bud-a.act)-(b.bud-b.act))[0];
 const h1=mo.slice(0,12).reduce((s,x)=>s+x.act,0), h2=mo.slice(12).reduce((s,x)=>s+x.act,0);
 const rt=regTotals(0,M.length-1,null).sort((a,b)=>b.act-a.act);
 const topReg=rt[0], totR=rt.reduce((s,x)=>s+x.act,0)||1;
 const streak=(()=>{let n=0;for(let i=mo.length-1;i>=0;i--){if(mo[i].act>mo[i].bud)n++;else break}return n})();
 const acts=[];
 if(over.length)acts.push(`Cap <b>${over[0].k}</b> — ${money(-over[0].v)} over plan (${Math.abs(pct(over[0].v,over[0].bud)).toFixed(1)}%). Re-baseline or find offsets.`);
 if(over[1])acts.push(`Review <b>${over[1].k}</b>, the second overrun at ${money(-over[1].v)}.`);
 acts.push(`Redeploy the <b>${under[0].k}</b> underspend of ${money(under[0].v)} before year end.`);
 if(streak>1)acts.push(`Actuals have run hot for <b>${streak} straight months</b> — tighten monthly approvals.`);
 acts.push(`<b>${topReg.k}</b> absorbs ${pct(topReg.act,totR).toFixed(0)}% of spend; confirm the allocation still matches the plan.`);
 const tr=[];
 tr.push(`Full-period actual is <span class="${ac<=bu?"ok":"warn"}">${pct(ac,bu).toFixed(1)}% of budget</span> (${signed(bu-ac)}).`);
 tr.push(`Year 2 spend is ${h2>=h1?"up":"down"} <b>${Math.abs(pct(h2-h1,h1)).toFixed(1)}%</b> on year 1.`);
 tr.push(`Worst single month: <b>${MLAB[worstM.i]}</b> at ${money(worstM.act)} against ${money(worstM.bud)}.`);
 tr.push(`${over.length} of ${ct.length} categories finished over plan; ${ct.length-over.length} came in under.`);
 return `<h3>Act on this</h3><ul>${acts.map(x=>`<li>${x}</li>`).join("")}</ul>`+
        `<h3>What the data shows</h3><ul>${tr.map(x=>`<li>${x}</li>`).join("")}</ul>`;
}

/* ---------- timeline ---------- */
function renderTimeline(){
 const mo=monthly(R0,R1);
 const box=document.getElementById("tlBox");
 if(!mo.length){box.innerHTML='<div class="empty">No months in range.</div>';return}
 const W=760,H=360,L=64,R=52,T=14,B=44;
 const iw=W-L-R, ih=H-T-B;
 const max=Math.max(...mo.map(x=>Math.max(x.bud,x.act)))*1.08||1;
 const step=iw/mo.length, bw=Math.max(2,Math.min(16,step*0.36));
 let cum=0; const cums=mo.map(x=>{cum+=x.bud-x.act;return cum});
 const cmax=Math.max(1,...cums.map(Math.abs));
 const y=v=>T+ih-(v/max)*ih;
 const cy=v=>T+ih/2-(v/cmax)*(ih/2-6);
 const ticks=[0,.25,.5,.75,1].map(f=>{const v=max*f;
  return `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
   <text x="${L-8}" y="${y(v)+5}" text-anchor="end" fill="var(--dim2)" font-size="13">${money(v)}</text>`}).join("");
 const every=Math.ceil(mo.length/12);
 const bars=mo.map((x,i)=>{
  const cx=L+step*i+step/2;
  const lab=(i%every===0||i===mo.length-1)?
   `<text x="${cx}" y="${H-B+18}" text-anchor="middle" fill="var(--dim2)" font-size="12">${MLAB[x.i]}</text>`:"";
  return `<rect x="${cx-bw-1}" y="${y(x.bud)}" width="${bw}" height="${Math.max(1,T+ih-y(x.bud))}" fill="var(--a1)" rx="2"><title>${MLAB[x.i]} budget ${money(x.bud)}</title></rect>
   <rect x="${cx+1}" y="${y(x.act)}" width="${bw}" height="${Math.max(1,T+ih-y(x.act))}" fill="var(--a2)" rx="2"><title>${MLAB[x.i]} actual ${money(x.act)}</title></rect>${lab}`}).join("");
 const pts=cums.map((v,i)=>`${L+step*i+step/2},${cy(v)}`).join(" ");
 const last=cums[cums.length-1];
 box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
   aria-label="Monthly budget versus actual columns from ${MLAB[R0]} to ${MLAB[R1]} with cumulative variance line ending at ${signed(last)}">
  ${ticks}${bars}
  <polyline points="${pts}" fill="none" stroke="var(--a4)" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="${W-R+6}" y="${cy(last)+4}" fill="var(--a4)" font-size="13" font-weight="600">${signed(last)}</text>
 </svg>`;
}

/* ---------- sankey ---------- */
function renderSankey(){
 const box=document.getElementById("sankBox");
 const cats=catTotals(R0,R1).filter(x=>x.act>=AMIN);
 const keep=new Set(cats.map(x=>x.k));
 const flows=[];
 REGS.forEach((r,ri)=>CATS.forEach((c,ci)=>{
  if(!keep.has(c))return;
  let v=0;for(let i=R0;i<=R1;i++)v+=D.act[i][ci][ri];
  if(v>0)flows.push({r,c,ri,ci,v});
 }));
 const tot=flows.reduce((s,f)=>s+f.v,0);
 document.getElementById("sankNote").textContent=
  `${MLAB[R0]}–${MLAB[R1]} · ${money(tot)}`;
 if(!flows.length){box.innerHTML='<div class="empty">No flows match the filters.</div>';return}
 const W=520,H=360,pad=12,nw=13,gap=8;
 const lx=88, rx=W-108;
 const regSum={},catSum={};
 flows.forEach(f=>{regSum[f.r]=(regSum[f.r]||0)+f.v;catSum[f.c]=(catSum[f.c]||0)+f.v});
 const lKeys=REGS.filter(r=>regSum[r]).sort((a,b)=>regSum[b]-regSum[a]);
 const rKeys=CATS.filter(c=>catSum[c]).sort((a,b)=>catSum[b]-catSum[a]);
 const avail=H-pad*2;
 const lScale=(avail-gap*(lKeys.length-1))/tot, rScale=(avail-gap*(rKeys.length-1))/tot;
 const lPos={},rPos={};let yy=pad;
 lKeys.forEach(k=>{const h=regSum[k]*lScale;lPos[k]={y:yy,h,cur:yy};yy+=h+gap});
 yy=pad;rKeys.forEach(k=>{const h=catSum[k]*rScale;rPos[k]={y:yy,h,cur:yy};yy+=h+gap});
 const paths=flows.sort((a,b)=>b.v-a.v).map(f=>{
  const L=lPos[f.r],R=rPos[f.c];
  const h1=f.v*lScale,h2=f.v*rScale;
  const y1=L.cur,y2=R.cur;L.cur+=h1;R.cur+=h2;
  const x1=lx+nw,x2=rx,mx=(x1+x2)/2;
  const col=C6[rKeys.indexOf(f.c)%C6.length];
  const d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2} L${x2},${y2+h2} C${mx},${y2+h2} ${mx},${y1+h1} ${x1},${y1+h1} Z`;
  return `<path d="${d}" fill="${col}" fill-opacity=".34"><title>${f.r} → ${f.c}: ${money(f.v)} (${pct(f.v,tot).toFixed(1)}%)</title></path>`;
 }).join("");
 const lNodes=lKeys.map((k,i)=>
  `<rect x="${lx}" y="${lPos[k].y}" width="${nw}" height="${Math.max(2,lPos[k].h)}" rx="3" fill="var(--a1)"><title>${k}: ${money(regSum[k])}</title></rect>
   <text x="${lx-7}" y="${lPos[k].y+lPos[k].h/2+4}" text-anchor="end" fill="var(--dim)" font-size="12">${k}</text>`).join("");
 const rNodes=rKeys.map((k,i)=>
  `<rect x="${rx}" y="${rPos[k].y}" width="${nw}" height="${Math.max(2,rPos[k].h)}" rx="3" fill="${C6[i%C6.length]}"><title>${k}: ${money(catSum[k])}</title></rect>
   <text x="${rx+nw+6}" y="${rPos[k].y+rPos[k].h/2+4}" fill="var(--dim)" font-size="12">${k}</text>`).join("");
 box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
  aria-label="Flow diagram of actual spend from ${lKeys.length} regions into ${rKeys.length} categories, ${money(tot)} total for ${MLAB[R0]} to ${MLAB[R1]}">
  ${paths}${lNodes}${rNodes}</svg>`;
}

/* ---------- tabs / theme ---------- */
const tabs=[...document.querySelectorAll(".tab")], views=[document.getElementById("view0"),document.getElementById("view1")];
function showTab(i){
 tabs.forEach((t,j)=>{t.setAttribute("aria-selected",String(j===i));t.tabIndex=j===i?0:-1});
 views.forEach((v,j)=>{v.hidden=j!==i});
 if(i!==1)stopPlay();
 render();scheduleFit();
}
tabs.forEach((t,i)=>{
 t.addEventListener("click",()=>{showTab(i);t.focus()});
 t.addEventListener("keydown",e=>{let n=null;
  if(e.key==="ArrowRight")n=(i+1)%tabs.length;
  if(e.key==="ArrowLeft")n=(i-1+tabs.length)%tabs.length;
  if(n!==null){e.preventDefault();showTab(n);tabs[n].focus()}});
});
const themeBtn=document.getElementById("themeBtn");
themeBtn.addEventListener("click",()=>{
 THEME=THEME==="dark"?"light":"dark";
 document.body.dataset.theme=THEME;
 themeBtn.setAttribute("aria-pressed",String(THEME==="light"));
 themeBtn.textContent=THEME==="dark"?"Light mode":"Dark mode";
});
const insWrap=document.getElementById("insWrap"),insBtn=document.getElementById("insBtn"),insCard=document.getElementById("insCard");
function openIns(on){insWrap.classList.toggle("open",on);insBtn.setAttribute("aria-expanded",String(on))}
insWrap.addEventListener("mouseenter",()=>openIns(true));
insWrap.addEventListener("mouseleave",()=>openIns(false));
insBtn.addEventListener("click",()=>openIns(!insWrap.classList.contains("open")));
insBtn.addEventListener("focus",()=>openIns(true));
insWrap.addEventListener("focusout",e=>{if(!insWrap.contains(e.relatedTarget))openIns(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openIns(false);stopPlay()}});

/* ---------- scale to fit ---------- */
const viewport=document.querySelector(".viewport"),page=document.querySelector(".page");
function contentHeight(){const t=page.getBoundingClientRect().top;let b=t+page.scrollHeight;
 page.querySelectorAll("*").forEach(e=>{if(e.matches(".tooltip,.card"))return;b=Math.max(b,e.getBoundingClientRect().bottom)});return b-t}
function fitPage(){const vw=viewport.clientWidth,vh=viewport.clientHeight;page.style.transform="none";page.style.width=vw+"px";
 if(contentHeight()<=vh){page.style.width="100%";return}
 let lo=0.2,hi=1;
 for(let i=0;i<12;i++){const s=(lo+hi)/2;page.style.width=(vw/s)+"px";if(contentHeight()*s<=vh){lo=s}else{hi=s}}
 page.style.width=(vw/lo)+"px";page.style.transform="scale("+lo+")"}
let ff;function scheduleFit(){cancelAnimationFrame(ff);ff=requestAnimationFrame(fitPage)}
new ResizeObserver(scheduleFit).observe(viewport);
window.addEventListener("load",scheduleFit);window.addEventListener("resize",scheduleFit);
if(document.fonts)document.fonts.ready.then(scheduleFit);

/* ---------- render ---------- */
function render(){
 const ct=catTotals(0,M.length-1);
 if(!views[0].hidden){renderKPIs(ct);renderCats(ct);renderSide()}
 if(!views[1].hidden){syncSliders();renderTimeline();renderSankey()}
 insCard.innerHTML=insights();
 document.getElementById("sub").textContent=
  `${CATS.length} spend categories · ${REGS.length} regions · ${MLAB[0]}–${MLAB[M.length-1]}`;
 scheduleFit();
}
document.body.dataset.theme=THEME;
buildCtrls0();buildCtrls1();syncSliders();render();

</script>
